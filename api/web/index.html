<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>Fatura OCR</title>
<style>
  :root {
    --bg:#f6f7fb; --kart:#ffffff; --metin:#0b1220; --soluk:#6b7280;
    --cizgi:#e8eaf0; --vurgu:#4f46e5; --vurgu2:#7c3aed; --vurgu-metin:#fff;
    --iyi:#059669; --iyi-bg:#ecfdf5; --kotu:#dc2626; --kotu-bg:#fef2f2;
    --golge:0 1px 2px rgba(16,24,40,.04), 0 8px 24px rgba(16,24,40,.06);
    --golge-yumusak:0 1px 2px rgba(16,24,40,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0a0f1c; --kart:#141b2d; --metin:#e8ecf5; --soluk:#94a0b8;
      --cizgi:#243049; --vurgu:#6366f1; --vurgu2:#a855f7;
      --iyi:#34d399; --iyi-bg:#052e26; --kotu:#f87171; --kotu-bg:#3f1414;
      --golge:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
      --golge-yumusak:0 1px 2px rgba(0,0,0,.3);
    }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    margin:0; background:var(--bg); color:var(--metin);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:calc(24px + env(safe-area-inset-bottom));
  }

  /* --- ust bant --- */
  .bant {
    background:linear-gradient(135deg,var(--vurgu) 0%,var(--vurgu2) 100%);
    color:#fff; padding:calc(18px + env(safe-area-inset-top)) 20px 26px;
  }
  .bant .ic { max-width:680px; margin:0 auto; }
  .bant .marka { display:flex; align-items:center; gap:11px; }
  .bant .logo {
    width:38px; height:38px; border-radius:11px; background:rgba(255,255,255,.18);
    display:grid; place-items:center; font-size:20px; backdrop-filter:blur(6px);
  }
  .bant h1 { margin:0; font-size:19px; font-weight:650; letter-spacing:-.2px; }
  .bant .altyazi { margin:1px 0 0; font-size:12.5px; opacity:.85; }
  .rozetler { display:flex; gap:7px; margin-top:16px; flex-wrap:wrap; }
  .rozet {
    display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:500;
    padding:5px 11px; border-radius:99px; background:rgba(255,255,255,.16);
    backdrop-filter:blur(6px);
  }
  .nokta { width:7px; height:7px; border-radius:50%; background:#fbbf24; }
  .nokta.canli { background:#4ade80; box-shadow:0 0 0 0 rgba(74,222,128,.7); animation:nabiz 2s infinite; }
  .nokta.olu { background:#f87171; }
  @keyframes nabiz { 70%{box-shadow:0 0 0 7px rgba(74,222,128,0);} 100%{box-shadow:0 0 0 0 rgba(74,222,128,0);} }

  main { max-width:680px; margin:0 auto; padding:0 16px; }
  .kart {
    background:var(--kart); border:1px solid var(--cizgi); border-radius:18px;
    padding:18px; margin-bottom:14px; box-shadow:var(--golge);
  }
  .kart.tasma { margin-top:-14px; }

  /* --- sekmeler --- */
  .sekmeler {
    display:flex; gap:4px; background:var(--kart); padding:4px; border-radius:13px;
    margin:18px 0 14px; border:1px solid var(--cizgi); box-shadow:var(--golge-yumusak);
  }
  .sekmeler button {
    flex:1; padding:10px; border:0; background:transparent; color:var(--soluk);
    border-radius:10px; font-size:14.5px; font-weight:550; cursor:pointer;
    font-family:inherit; transition:.18s;
  }
  .sekmeler button.aktif {
    background:linear-gradient(135deg,var(--vurgu),var(--vurgu2));
    color:var(--vurgu-metin); box-shadow:0 3px 10px rgba(79,70,229,.3);
  }

  /* --- yukleme alani --- */
  label.dosya {
    display:flex; flex-direction:column; align-items:center; gap:9px;
    padding:32px 18px; border:2px dashed var(--cizgi); border-radius:15px;
    cursor:pointer; text-align:center; transition:.18s;
  }
  label.dosya:active { border-color:var(--vurgu); transform:scale(.99); }
  label.dosya .ikon {
    width:52px; height:52px; border-radius:15px; display:grid; place-items:center;
    background:linear-gradient(135deg,var(--vurgu),var(--vurgu2)); font-size:24px;
    box-shadow:0 5px 16px rgba(79,70,229,.32);
  }
  label.dosya b { font-size:15.5px; font-weight:600; }
  label.dosya span.ipucu { font-size:12.5px; color:var(--soluk); }
  input[type=file] { display:none; }

  .onizleme-sarmal { position:relative; margin-top:14px; display:none; }
  #onizleme { width:100%; border-radius:13px; display:block; }
  .kaldir {
    position:absolute; top:9px; right:9px; width:31px; height:31px; border:0;
    border-radius:50%; background:rgba(15,23,42,.62); color:#fff; font-size:17px;
    cursor:pointer; backdrop-filter:blur(6px); line-height:1;
  }

  button.ana {
    width:100%; padding:15px; margin-top:13px; border:0; border-radius:13px;
    background:linear-gradient(135deg,var(--vurgu),var(--vurgu2)); color:#fff;
    font-size:15.5px; font-weight:600; cursor:pointer; font-family:inherit;
    box-shadow:0 5px 16px rgba(79,70,229,.3); transition:.18s;
  }
  button.ana:active:not(:disabled) { transform:scale(.985); }
  button.ana:disabled { opacity:.4; box-shadow:none; cursor:default; }

  /* --- ilerleme --- */
  .adimlar { display:flex; flex-direction:column; gap:11px; margin-top:15px; }
  .adim { display:flex; align-items:center; gap:11px; font-size:14px; color:var(--soluk); }
  .adim .kutu {
    width:26px; height:26px; border-radius:8px; display:grid; place-items:center;
    background:var(--bg); border:1px solid var(--cizgi); font-size:13px; flex:0 0 auto;
  }
  .adim.calisiyor { color:var(--metin); font-weight:550; }
  .adim.calisiyor .kutu { background:linear-gradient(135deg,var(--vurgu),var(--vurgu2)); border-color:transparent; }
  .adim.bitti .kutu { background:var(--iyi-bg); border-color:transparent; color:var(--iyi); }
  .donen {
    width:13px; height:13px; border:2px solid rgba(255,255,255,.4);
    border-top-color:#fff; border-radius:50%; animation:don .7s linear infinite;
  }
  @keyframes don { to { transform:rotate(360deg); } }
  .sure { margin-left:auto; font-variant-numeric:tabular-nums; font-size:12.5px; }

  /* --- sonuc --- */
  .baslik-satir { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px; }
  .baslik-satir b { font-size:16px; }
  .etiket {
    font-size:11.5px; padding:4px 9px; border-radius:7px; background:var(--bg);
    color:var(--soluk); font-variant-numeric:tabular-nums; border:1px solid var(--cizgi);
  }
  .alan {
    display:flex; align-items:flex-start; gap:12px; padding:12px;
    border-radius:11px; margin-bottom:7px; background:var(--bg);
  }
  .alan .ikon { font-size:16px; width:20px; text-align:center; flex:0 0 auto; }
  .alan .govde { flex:1; min-width:0; }
  .alan .ad { font-size:11px; color:var(--soluk); text-transform:uppercase; letter-spacing:.6px; font-weight:600; }
  .alan .deger { font-size:15px; font-weight:550; word-break:break-word; margin-top:2px; }
  .alan .deger.bos { color:var(--soluk); font-weight:400; font-style:italic; font-size:14px; }
  .alan.one-cikan { background:var(--iyi-bg); }
  .alan.one-cikan .deger { color:var(--iyi); font-size:19px; font-weight:700; }

  .butonlar { display:flex; gap:8px; margin-top:12px; }
  .butonlar button {
    flex:1; padding:11px; border:1px solid var(--cizgi); background:var(--kart);
    color:var(--metin); border-radius:11px; font-size:13.5px; font-weight:550;
    cursor:pointer; font-family:inherit;
  }
  details { margin-top:12px; }
  summary { cursor:pointer; color:var(--soluk); font-size:13.5px; padding:7px 0; list-style:none; }
  summary::-webkit-details-marker { display:none; }
  summary::before { content:"▸ "; }
  details[open] summary::before { content:"▾ "; }
  details pre {
    white-space:pre-wrap; word-break:break-word; font-size:11.5px; line-height:1.5;
    background:var(--bg); padding:13px; border-radius:11px; max-height:260px;
    overflow:auto; margin:0; font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  }

  /* --- kayitlar --- */
  .ozet { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px; }
  .ozet .hucre { background:var(--kart); border:1px solid var(--cizgi); border-radius:14px; padding:14px; box-shadow:var(--golge-yumusak); }
  .ozet .sayi { font-size:23px; font-weight:700; letter-spacing:-.5px; }
  .ozet .etiket2 { font-size:11.5px; color:var(--soluk); text-transform:uppercase; letter-spacing:.5px; font-weight:600; margin-top:1px; }
  .kayit {
    display:flex; align-items:center; gap:12px; padding:13px 12px; border-radius:12px;
    cursor:pointer; transition:.15s;
  }
  .kayit:active { background:var(--bg); }
  .kayit .bas {
    width:40px; height:40px; border-radius:12px; flex:0 0 auto; display:grid;
    place-items:center; font-weight:700; font-size:14.5px; color:#fff;
    background:linear-gradient(135deg,var(--vurgu),var(--vurgu2));
  }
  .kayit .orta { flex:1; min-width:0; }
  .kayit .firma { font-weight:600; font-size:14.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .kayit .alt { font-size:12px; color:var(--soluk); margin-top:1px; }
  .kayit .tutar { font-weight:700; color:var(--iyi); white-space:nowrap; font-size:14.5px; }

  .bos-durum { text-align:center; padding:34px 16px; color:var(--soluk); }
  .bos-durum .buyuk { font-size:40px; opacity:.35; }
  .uyari { padding:12px 13px; border-radius:11px; background:var(--kotu-bg); color:var(--kotu); font-size:13.5px; margin-top:11px; }
  .gizli { display:none !important; }
  .belir { animation:belir .28s ease-out; }
  @keyframes belir { from{opacity:0; transform:translateY(7px);} to{opacity:1; transform:none;} }
</style>
</head>
<body>

<div class="bant">
  <div class="ic">
    <div class="marka">
      <div class="logo">🧾</div>
      <div>
        <h1>Fatura OCR</h1>
        <p class="altyazi">Görselden yapılandırılmış veriye</p>
      </div>
    </div>
    <div class="rozetler">
      <span class="rozet"><span class="nokta" id="nokta"></span><span id="durumYazi">bağlanıyor…</span></span>
      <span class="rozet gizli" id="rozetModel"></span>
      <span class="rozet gizli" id="rozetKayit"></span>
    </div>
  </div>
</div>

<main>
  <div class="sekmeler">
    <button id="sekmeYeni" class="aktif" onclick="sekmeyeGec('yeni')">Yeni Fatura</button>
    <button id="sekmeKayit" onclick="sekmeyeGec('kayit')">Kayıtlar</button>
  </div>

  <section id="bolumYeni">
    <div class="kart">
      <label class="dosya" for="dosya">
        <div class="ikon">📷</div>
        <b>Fotoğraf çek veya seç</b>
        <span class="ipucu">Fatura ya da fiş görseli · JPG, PNG</span>
      </label>
      <input type="file" id="dosya" accept="image/*" capture="environment" onchange="dosyaSecildi(this)">

      <div class="onizleme-sarmal" id="onizlemeSarmal">
        <img id="onizleme" alt="">
        <button class="kaldir" onclick="secimiTemizle()" title="Kaldır">×</button>
      </div>

      <button class="ana" id="gonderBtn" onclick="gonder()" disabled>Analiz Et</button>

      <div id="ilerleme" class="adimlar gizli">
        <div class="adim" id="adimOcr">
          <div class="kutu" id="kutuOcr">1</div>
          <span>Görsel okunuyor (OCR)</span><span class="sure" id="sureOcr"></span>
        </div>
        <div class="adim" id="adimLlm">
          <div class="kutu" id="kutuLlm">2</div>
          <span>Alanlar ayıklanıyor (LLM)</span><span class="sure" id="sureLlm"></span>
        </div>
      </div>

      <div id="hata" class="uyari gizli"></div>
    </div>

    <div class="kart gizli" id="sonucKart">
      <div class="baslik-satir">
        <b>Ayıklanan Veriler</b>
        <span class="etiket" id="etiketSure"></span>
      </div>
      <div id="sonucAlanlar"></div>
      <div class="butonlar">
        <button onclick="jsonKopyala()" id="kopyalaBtn">JSON kopyala</button>
        <button onclick="sekmeyeGec('kayit')">Kayıtlara git</button>
      </div>
      <details>
        <summary>OCR ham metni</summary>
        <pre id="hamMetin"></pre>
      </details>
    </div>
  </section>

  <section id="bolumKayit" class="gizli">
    <div class="ozet">
      <div class="hucre"><div class="sayi" id="ozetAdet">—</div><div class="etiket2">Kayıtlı fatura</div></div>
      <div class="hucre"><div class="sayi" id="ozetTutar">—</div><div class="etiket2">Toplam tutar</div></div>
    </div>
    <div class="kart">
      <div id="kayitListe"><div class="bos-durum">Yükleniyor…</div></div>
    </div>
  </section>
</main>

<script>
const ALANLAR = [
  ["company_name", "Firma",     "🏢", false],
  ["total_amount", "Toplam",    "💰", true ],
  ["date",         "Tarih",     "📅", false],
  ["invoice_no",   "Fatura No", "#️⃣", false],
  ["address",      "Adres",     "📍", false],
];

let secilenDosya = null, sonSonuc = null;

function sekmeyeGec(hangi) {
  const yeni = hangi === "yeni";
  document.getElementById("bolumYeni").classList.toggle("gizli", !yeni);
  document.getElementById("bolumKayit").classList.toggle("gizli", yeni);
  document.getElementById("sekmeYeni").classList.toggle("aktif", yeni);
  document.getElementById("sekmeKayit").classList.toggle("aktif", !yeni);
  if (!yeni) kayitlariYukle();
}

function dosyaSecildi(girdi) {
  secilenDosya = girdi.files[0] || null;
  const sarmal = document.getElementById("onizlemeSarmal");
  if (secilenDosya) {
    document.getElementById("onizleme").src = URL.createObjectURL(secilenDosya);
    sarmal.style.display = "block";
    sarmal.classList.add("belir");
  } else sarmal.style.display = "none";
  document.getElementById("gonderBtn").disabled = !secilenDosya;
  hatayiGizle();
}

function secimiTemizle() {
  document.getElementById("dosya").value = "";
  dosyaSecildi({ files: [] });
  document.getElementById("sonucKart").classList.add("gizli");
}

function hatayiGoster(m) {
  const h = document.getElementById("hata");
  h.textContent = m; h.classList.remove("gizli");
}
function hatayiGizle() { document.getElementById("hata").classList.add("gizli"); }

function adimDurum(ad, durum, sure) {
  const adim = document.getElementById("adim" + ad);
  const kutu = document.getElementById("kutu" + ad);
  adim.className = "adim" + (durum ? " " + durum : "");
  kutu.innerHTML = durum === "calisiyor" ? '<div class="donen"></div>'
                 : durum === "bitti" ? "✓" : (ad === "Ocr" ? "1" : "2");
  document.getElementById("sure" + ad).textContent = sure || "";
}

async function gonder() {
  if (!secilenDosya) return;
  const btn = document.getElementById("gonderBtn");
  btn.disabled = true;
  hatayiGizle();
  document.getElementById("sonucKart").classList.add("gizli");
  document.getElementById("ilerleme").classList.remove("gizli");

  // Sunucu ara durum bildirmiyor; OCR'in LLM'den once bittigini biliyoruz ama
  // tam ne zaman bittigini bilmiyoruz. Gecen sureyi gostermek, kullanicinin
  // "dondu mu" diye endiselenmesini engelliyor - islem 20+ saniye surebiliyor.
  adimDurum("Ocr", "calisiyor"); adimDurum("Llm", "");
  const basla = Date.now();
  const sayac = setInterval(() => {
    document.getElementById("sureOcr").textContent = ((Date.now() - basla) / 1000).toFixed(0) + " sn";
  }, 200);

  try {
    const form = new FormData();
    form.append("file", secilenDosya);
    const cevap = await fetch("/analyze-invoice", { method: "POST", body: form });
    if (!cevap.ok) {
      let m = "HTTP " + cevap.status;
      try { const j = await cevap.json(); m = j.detail || j.error || m; } catch (e) {}
      throw new Error(m);
    }
    const s = await cevap.json();
    clearInterval(sayac);
    adimDurum("Ocr", "bitti", (s.meta.ocr_seconds ?? "—") + " sn");
    adimDurum("Llm", "bitti", (s.meta.llm_seconds ?? "—") + " sn");
    sonucuGoster(s);
  } catch (e) {
    clearInterval(sayac);
    document.getElementById("ilerleme").classList.add("gizli");
    hatayiGoster("Hata: " + e.message);
  } finally {
    btn.disabled = false;
    durumuYenile();
  }
}

function sonucuGoster(s) {
  sonSonuc = s;
  const kap = document.getElementById("sonucAlanlar");
  kap.innerHTML = ALANLAR.map(([anahtar, etiket, ikon, oneCikan]) => {
    const d = s.data ? s.data[anahtar] : null;
    const bos = d === null || d === undefined || d === "";
    return '<div class="alan' + (oneCikan && !bos ? " one-cikan" : "") + '">' +
             '<div class="ikon">' + ikon + "</div>" +
             '<div class="govde"><div class="ad">' + etiket + "</div>" +
             '<div class="deger' + (bos ? " bos" : "") + '">' +
             (bos ? "bulunamadı" : kacisli(d)) + "</div></div></div>";
  }).join("");

  const m = s.meta || {}, p = [];
  if (m.ocr_seconds != null) p.push("OCR " + m.ocr_seconds + "s");
  if (m.llm_seconds != null) p.push("LLM " + m.llm_seconds + "s");
  if (s.id) p.push("#" + s.id);
  document.getElementById("etiketSure").textContent = p.join(" · ");
  document.getElementById("hamMetin").textContent = s.raw_text || "(boş)";

  const kart = document.getElementById("sonucKart");
  kart.classList.remove("gizli"); kart.classList.add("belir");
  if (m.kayit_hatasi) hatayiGoster("Sonuç alındı ama kaydedilemedi: " + m.kayit_hatasi);
  kart.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function jsonKopyala() {
  if (!sonSonuc) return;
  const btn = document.getElementById("kopyalaBtn");
  navigator.clipboard.writeText(JSON.stringify(sonSonuc.data, null, 2)).then(() => {
    btn.textContent = "✓ Kopyalandı";
    setTimeout(() => (btn.textContent = "JSON kopyala"), 1600);
  }).catch(() => hatayiGoster("Panoya kopyalanamadı"));
}

function tutariSayiyaCevir(s) {
  if (!s) return 0;
  const m = String(s).replace(/[^\d.,]/g, "").replace(/\.(?=\d{3}\b)/g, "").replace(",", ".");
  const n = parseFloat(m);
  return isNaN(n) ? 0 : n;
}

async function kayitlariYukle() {
  const liste = document.getElementById("kayitListe");
  try {
    const j = await (await fetch("/faturalar?limit=100")).json();
    document.getElementById("ozetAdet").textContent = j.toplam;
    document.getElementById("ozetTutar").textContent =
      j.kayitlar.reduce((t, k) => t + tutariSayiyaCevir(k.total_amount), 0)
        .toLocaleString("tr-TR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    if (!j.kayitlar.length) {
      liste.innerHTML = '<div class="bos-durum"><div class="buyuk">📭</div>' +
                        "<p>Henüz kayıt yok<br><small>İlk faturanı analiz et</small></p></div>";
      return;
    }
    liste.innerHTML = j.kayitlar.map(k => {
      const firma = k.company_name || "(firma yok)";
      const bas = firma.replace(/[^A-Za-zÇĞİÖŞÜçğıöşü]/g, "").slice(0, 2).toUpperCase() || "?";
      return '<div class="kayit" onclick="kaydiAc(' + k.id + ')">' +
               '<div class="bas">' + kacisli(bas) + "</div>" +
               '<div class="orta"><div class="firma">' + kacisli(firma) + "</div>" +
               '<div class="alt">' + kacisli(k.date || "tarihsiz") + " · #" + k.id + "</div></div>" +
               '<div class="tutar">' + kacisli(k.total_amount || "—") + "</div></div>";
    }).join("");
  } catch (e) {
    liste.innerHTML = '<div class="bos-durum">Kayıtlar yüklenemedi<br><small>' + kacisli(e.message) + "</small></div>";
  }
}

async function kaydiAc(id) {
  const c = await fetch("/faturalar/" + id);
  if (!c.ok) return;
  const k = await c.json();
  sekmeyeGec("yeni");
  document.getElementById("onizlemeSarmal").style.display = "none";
  document.getElementById("ilerleme").classList.add("gizli");
  sonucuGoster({
    id: k.id,
    data: { company_name:k.company_name, date:k.date, address:k.address,
            total_amount:k.total_amount, invoice_no:k.invoice_no },
    raw_text: k.raw_text,
    meta: { ocr_seconds:k.ocr_saniye, llm_seconds:k.llm_saniye },
  });
}

async function durumuYenile() {
  const nokta = document.getElementById("nokta"), yazi = document.getElementById("durumYazi");
  const rModel = document.getElementById("rozetModel"), rKayit = document.getElementById("rozetKayit");
  try {
    const s = await (await fetch("/health")).json();
    nokta.className = "nokta " + (s.llm_ready ? "canli" : "");
    yazi.textContent = s.llm_ready ? "Hazır" : "Sadece OCR";
    rModel.textContent = s.adapter ? "⚡ Fine-tuned model" : "Base model";
    rKayit.textContent = "🗂 " + s.kayit_sayisi + " kayıt";
    rModel.classList.remove("gizli"); rKayit.classList.remove("gizli");
  } catch (e) {
    nokta.className = "nokta olu";
    yazi.textContent = "Servise ulaşılamıyor";
  }
}

// Fatura icerigi ve veritabanindan gelen metin dogrudan HTML'e yazilmiyor.
function kacisli(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}

durumuYenile();
setInterval(durumuYenile, 30000);
</script>
